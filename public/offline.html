<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#05070d" />
    <title>Offline | Zenith Companion</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-base: #050505;
        --bg-panel: #0f0f11;
        --bg-card: #141416;
        --text-main: #f4f4f5;
        --text-muted: #a1a1aa;
        --text-accent: #f5b041;
        --border-subtle: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--text-accent), transparent 90%), transparent 36%),
          var(--bg-base);
        color: var(--text-main);
        display: flex;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: clamp(1rem, 4vw, 2rem);
      }

      main {
        background:
          linear-gradient(180deg, color-mix(in srgb, var(--text-accent), transparent 95%), transparent 42%),
          color-mix(in srgb, var(--bg-panel), #000 12%);
        border: 1px solid color-mix(in srgb, var(--text-accent), transparent 72%);
        border-radius: 8px;
        box-shadow: 0 28px 82px rgba(0, 0, 0, 0.42);
        display: grid;
        gap: 1rem;
        max-width: 580px;
        padding: clamp(1.1rem, 4vw, 1.6rem);
        position: relative;
        width: min(100%, 580px);
      }

      main::before {
        background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text-accent), transparent 38%), transparent);
        content: "";
        height: 1px;
        left: 0;
        position: absolute;
        right: 0;
        top: 0;
      }

      .brand {
        align-items: center;
        display: flex;
        gap: 0.8rem;
      }

      .mark {
        align-items: center;
        background: color-mix(in srgb, var(--text-accent), transparent 86%);
        border: 1px solid color-mix(in srgb, var(--text-accent), transparent 56%);
        border-radius: 8px;
        color: var(--text-accent);
        display: inline-flex;
        height: 48px;
        justify-content: center;
        width: 48px;
      }

      .eyebrow {
        color: var(--text-accent);
        display: block;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(1.45rem, 5vw, 2.05rem);
        line-height: 1.05;
        margin: 0.12rem 0 0;
      }

      p {
        color: var(--text-muted);
        line-height: 1.55;
        margin: 0;
      }

      .panel {
        background: rgba(255, 255, 255, 0.025);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        display: grid;
        gap: 0.35rem;
        padding: 0.9rem;
      }

      .panel strong {
        color: var(--text-main);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
      }

      button,
      a {
        align-items: center;
        border-radius: 7px;
        display: inline-flex;
        font: inherit;
        font-size: 0.88rem;
        font-weight: 800;
        justify-content: center;
        min-height: 40px;
        padding: 0.68rem 0.9rem;
        text-decoration: none;
      }

      button {
        background: var(--text-accent);
        border: 1px solid color-mix(in srgb, var(--text-accent), #000 18%);
        color: #111;
        cursor: pointer;
      }

      a {
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid var(--border-subtle);
        color: var(--text-main);
      }

      button:focus-visible,
      a:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--text-accent), white 12%);
        outline-offset: 3px;
      }

      @media (max-width: 520px) {
        .actions {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg width="25" height="25" viewBox="0 0 24 24" fill="none">
            <path d="M8.4 15.6 10.6 10.6 15.6 8.4 13.4 13.4 8.4 15.6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
          </svg>
        </span>
        <div>
          <span class="eyebrow">Zenith Companion</span>
          <h1>You are offline</h1>
        </div>
      </div>

      <p>
        Zenith can keep your local browser data, but fresh market, item, guild, and world data need a connection.
      </p>

      <section class="panel" aria-label="Offline details">
        <strong>No public data was refreshed.</strong>
        <span>Reconnect and retry the page when your network is back. Local profiles and settings remain on this device.</span>
      </section>

      <div class="actions">
        <button type="button" onclick="window.location.reload()">Try again</button>
        <a href="/">Open dashboard</a>
      </div>
    </main>
  </body>
</html>
