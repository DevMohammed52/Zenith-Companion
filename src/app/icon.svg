<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Zenith Companion">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="60%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="zGradUpper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="zGradLower" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(148, 163, 184, 0.2)"/>
      <stop offset="50%" stop-color="rgba(248, 250, 252, 0.95)"/>
      <stop offset="100%" stop-color="rgba(148, 163, 184, 0.2)"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle with subtle border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Centered Zenith Mark (scaled from 256x256 to 48x48) -->
  <g transform="translate(8, 8) scale(0.1875)">
    <!-- Celestial Horizon Arc -->
    <path d="M 18 116 Q 64 42 128 34 Q 192 42 238 116 Q 192 52 128 44 Q 64 52 18 116 Z" fill="url(#arcGrad)"/>
    <!-- Apex Star -->
    <path d="M 128 10 L 136 56 L 160 66 L 136 76 L 128 104 L 120 76 L 96 66 L 120 56 Z" fill="#ffffff"/>
    <!-- Upper Z Polygon -->
    <path d="M 84 102 L 212 102 L 98 204 L 26 214 L 92 172 L 164 122 L 84 122 L 52 144 Z" fill="url(#zGradUpper)"/>
    <!-- Lower Z Wing -->
    <path d="M 112 204 L 188 204 L 228 160 L 194 178 L 146 178 Z" fill="url(#zGradLower)"/>
  </g>
</svg>
