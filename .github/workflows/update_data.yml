name: Update Market, Boss & Pet Data

on:
  schedule:
    - cron: '0 */6 * * *' # Full update every 6 hours
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: market-data-main
  cancel-in-progress: false

jobs:
  update-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Market, Boss & Pet Scraper
        env:
          IDLEMMO_API_KEY: ${{ secrets.IDLEMMO_API_KEY }}
          SCRAPE_ONCE: "true"
        run: node scraper.mjs

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/*.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git stash push -m "generated market data" -- public/*.json
          git pull --rebase origin main
          git stash pop
          git add public/*.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: auto-update market, boss, and pet data [skip ci]"
          git push origin "HEAD:main"
