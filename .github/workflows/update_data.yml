name: Update Market, Boss, Pet & Conquest Data

on:
  schedule:
    # GitHub cron cannot express a continuous 75-minute interval cleanly across midnight.
    # This keeps 75-minute spacing during the day with one conservative 90-minute overnight gap.
    - cron: '0 0,5,10,15,20 * * *'
    - cron: '15 1,6,11,16,21 * * *'
    - cron: '30 2,7,12,17,22 * * *'
    - cron: '45 3,8,13,18 * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  # Keep every scheduled IdleMMO API data job in one lane so generated-data
  # workflows do not stack requests against the same API key.
  group: idlemmo-api-data-main
  cancel-in-progress: false

jobs:
  update-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Report data scraper start
        env:
          SCRAPER_COORDINATOR_URL: ${{ secrets.SCRAPER_COORDINATOR_URL }}
          SCRAPER_COORDINATOR_SECRET: ${{ secrets.SCRAPER_COORDINATOR_SECRET }}
        run: |
          if [ -z "$SCRAPER_COORDINATOR_URL" ] || [ -z "$SCRAPER_COORDINATOR_SECRET" ]; then
            echo "Scraper coordinator is not configured; skipping start report."
            exit 0
          fi
          started_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          payload=$(printf '{"status":"started","source":"github-actions:update_data","runId":"%s","startedAt":"%s"}' "$GITHUB_RUN_ID" "$started_at")
          curl -fsS -X POST "$SCRAPER_COORDINATOR_URL/internal/scraper-status" \
            -H "Authorization: Bearer $SCRAPER_COORDINATOR_SECRET" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            || echo "Scraper coordinator start report failed; continuing with conservative import fallback."

      - name: Run Market, Boss, Pet & Conquest Scraper
        env:
          IDLEMMO_API_KEY: ${{ secrets.IDLEMMO_API_KEY }}
          SCRAPE_ONCE: "true"
        run: node scraper.mjs

      - name: Report data scraper finish
        if: always()
        env:
          SCRAPER_COORDINATOR_URL: ${{ secrets.SCRAPER_COORDINATOR_URL }}
          SCRAPER_COORDINATOR_SECRET: ${{ secrets.SCRAPER_COORDINATOR_SECRET }}
        run: |
          if [ -z "$SCRAPER_COORDINATOR_URL" ] || [ -z "$SCRAPER_COORDINATOR_SECRET" ]; then
            echo "Scraper coordinator is not configured; skipping finish report."
            exit 0
          fi
          status="finished"
          if [ "${{ job.status }}" != "success" ]; then
            status="failed"
          fi
          finished_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          payload=$(printf '{"status":"%s","source":"github-actions:update_data","runId":"%s","finishedAt":"%s"}' "$status" "$GITHUB_RUN_ID" "$finished_at")
          curl -fsS -X POST "$SCRAPER_COORDINATOR_URL/internal/scraper-status" \
            -H "Authorization: Bearer $SCRAPER_COORDINATOR_SECRET" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            || echo "Scraper coordinator finish report failed; coordinator TTL will expire stale state."

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/*.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git stash push --include-untracked -m "generated market and conquest data" -- public/*.json
          git pull --rebase origin main
          git stash pop || { echo "Generated data changed upstream. Resolve the generated JSON conflict before pushing."; git status --short; exit 1; }
          git add public/*.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: auto-update market, boss, pet, and conquest data [skip ci]"
          for attempt in 1 2 3; do
            git push origin "HEAD:main" && exit 0
            echo "Push attempt ${attempt} failed; rebasing generated-data commit onto latest main."
            git pull --rebase origin main
          done
          echo "Unable to push generated data after 3 attempts."
          exit 1
