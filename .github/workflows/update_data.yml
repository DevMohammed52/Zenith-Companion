name: Update Market, Boss, Pet & Conquest Data

on:
  schedule:
    # GitHub cron cannot express a continuous 75-minute interval cleanly across midnight.
    # This keeps 75-minute spacing during the day with one conservative 90-minute overnight gap.
    - cron: '0 0,5,10,15,20 * * *'
    - cron: '15 1,6,11,16,21 * * *'
    - cron: '30 2,7,12,17,22 * * *'
    - cron: '45 3,8,13,18 * * *'
  workflow_dispatch:
    inputs:
      refresh_scope:
        description: 'Data refresh scope'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - priority
          - pets
          - locations
          - conquest

concurrency:
  # Keep every scheduled IdleMMO API data job in one lane so generated-data
  # workflows do not stack requests against the same API key.
  group: idlemmo-api-data-main
  cancel-in-progress: false

jobs:
  update-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve data refresh scope
        id: data_scope
        run: |
          scope="full"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scope="${{ inputs.refresh_scope }}"
          fi

          echo "scope=${scope}" >> "$GITHUB_OUTPUT"

      - name: Report data scraper start
        env:
          SCRAPER_COORDINATOR_URL: ${{ secrets.SCRAPER_COORDINATOR_URL }}
          SCRAPER_COORDINATOR_SECRET: ${{ secrets.SCRAPER_COORDINATOR_SECRET }}
        run: |
          if [ -z "$SCRAPER_COORDINATOR_URL" ] || [ -z "$SCRAPER_COORDINATOR_SECRET" ]; then
            echo "Scraper coordinator is not configured; skipping start report."
            exit 0
          fi
          started_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          payload=$(printf '{"status":"started","source":"github-actions:update_data","runId":"%s","startedAt":"%s"}' "$GITHUB_RUN_ID" "$started_at")
          curl --connect-timeout 5 --max-time 10 -fsS -X POST "$SCRAPER_COORDINATOR_URL/internal/scraper-status" \
            -H "Authorization: Bearer $SCRAPER_COORDINATOR_SECRET" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            || echo "Scraper coordinator start report failed; continuing with conservative import fallback."

      - name: Run Market, Boss, Pet & Conquest Scraper
        env:
          IDLEMMO_API_KEY: ${{ secrets.IDLEMMO_API_KEY }}
        run: |
          case "${{ steps.data_scope.outputs.scope }}" in
            full)
              SCRAPE_ONCE=true node scraper.mjs
              ;;
            priority)
              node scraper.mjs --priority --once
              ;;
            pets)
              node scraper.mjs --pets-only --once
              ;;
            locations)
              node scraper.mjs --world-locations-only
              ;;
            conquest)
              node scraper.mjs --conquest-only
              ;;
            *)
              echo "Unknown data refresh scope: ${{ steps.data_scope.outputs.scope }}"
              exit 1
              ;;
          esac

      - name: Commit and Push changes
        run: |
          node scripts/publish-generated-data.mjs \
            --path=public/market-data.json \
            --path=public/static-data.json \
            --path=public/pet-database.json \
            --path=public/world-locations.json \
            --path=public/conquest-data.json \
            --path=public/scraper-status.json \
            --path=public/usage-map.json \
            --path=public/search-index.json \
            --path=public/global-search-index.json \
            --commit-message="chore: auto-update market, boss, pet, and conquest data [skip ci]" \
            --empty-message="No changes to commit" \
            --retry-message="refreshing generated-data commit onto latest main."

      - name: Report data pipeline finish
        if: always()
        env:
          SCRAPER_COORDINATOR_URL: ${{ secrets.SCRAPER_COORDINATOR_URL }}
          SCRAPER_COORDINATOR_SECRET: ${{ secrets.SCRAPER_COORDINATOR_SECRET }}
        run: |
          if [ -z "$SCRAPER_COORDINATOR_URL" ] || [ -z "$SCRAPER_COORDINATOR_SECRET" ]; then
            echo "Scraper coordinator is not configured; skipping finish report."
            exit 0
          fi
          status="finished"
          if [ "${{ job.status }}" != "success" ]; then
            status="failed"
          fi
          finished_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          payload=$(printf '{"status":"%s","source":"github-actions:update_data","runId":"%s","finishedAt":"%s"}' "$status" "$GITHUB_RUN_ID" "$finished_at")
          curl --connect-timeout 5 --max-time 10 -fsS -X POST "$SCRAPER_COORDINATOR_URL/internal/scraper-status" \
            -H "Authorization: Bearer $SCRAPER_COORDINATOR_SECRET" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            || echo "Scraper coordinator finish report failed; coordinator TTL will expire stale state."
